aid: tripcom
name: Trip.com
description: >-
  Trip.com is a leading global online travel agency and part of Trip.com Group,
  offering one-stop travel booking for flights, hotels, trains, car rentals,
  airport transfers, attraction tickets, tours, and vacation packages across 39
  countries and regions in 24 languages. Trip.com publishes a public AI
  travel-assistant plugin API (an OpenAI-plugin-style OpenAPI at
  www.trip.com/ai-resource) that lets assistants search flights, hotels, car
  hire, and attractions/activities and return deep booking links, alongside a
  published llms.txt describing its site structure for AI agents.
